<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maths Tools</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 4Q16 52 28 4' fill='none' stroke='%234a90e2' stroke-width='4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header>
      <nav class="tabs" role="tablist">
        <a href="#quadratic" role="tab" data-tab="quadratic">Quadratic</a>
        <a href="#transform" role="tab" data-tab="transform">Transformations</a>
      </nav>
    </header>

    <main>
      <section data-panel="quadratic" class="tab-panel card" role="tabpanel">
        <h1>Quadratic Equation Explorer</h1>

        <div class="tool-layout">
          <div class="graph">
            <canvas aria-label="Graph of the quadratic equation"></canvas>
          </div>

          <div class="controls">
            <div class="control">
              <label for="slider-a">a</label>
              <input type="range" id="slider-a" data-param="a" min="-5" max="5" step="0.1" />
              <output data-param="a"></output>
            </div>

            <fieldset>
              <legend>Standard form <span class="template">y = ax² + bx + c</span></legend>
              <div class="equation" data-equation="standard"></div>
              <div class="control">
                <label for="slider-b">b</label>
                <input type="range" id="slider-b" data-param="b" data-form="standard" min="-20" max="20" step="0.1" />
                <output data-param="b"></output>
              </div>
              <div class="control">
                <label for="slider-c">c</label>
                <input type="range" id="slider-c" data-param="c" data-form="standard" min="-20" max="20" step="0.1" />
                <output data-param="c"></output>
              </div>
            </fieldset>

            <fieldset>
              <legend>Vertex form <span class="template">y = a(x − h)² + k</span></legend>
              <div class="equation" data-equation="vertex"></div>
              <div class="control">
                <label for="slider-h">h</label>
                <input type="range" id="slider-h" data-param="h" data-form="vertex" min="-10" max="10" step="0.1" />
                <output data-param="h"></output>
              </div>
              <div class="control">
                <label for="slider-k">k</label>
                <input type="range" id="slider-k" data-param="k" data-form="vertex" min="-10" max="10" step="0.1" />
                <output data-param="k"></output>
              </div>
            </fieldset>

            <fieldset>
              <legend>Factored form <span class="template">y = a(x − r₁)(x − r₂)</span></legend>
              <div class="equation" data-equation="factored"></div>
              <div class="control">
                <label for="slider-r1">r₁</label>
                <input type="range" id="slider-r1" data-param="r1" data-form="factored" min="-10" max="10" step="0.1" />
                <output data-param="r1"></output>
              </div>
              <div class="control">
                <label for="slider-r2">r₂</label>
                <input type="range" id="slider-r2" data-param="r2" data-form="factored" min="-10" max="10" step="0.1" />
                <output data-param="r2"></output>
              </div>
            </fieldset>
          </div>
        </div>
      </section>
      <section data-panel="transform" class="tab-panel card" role="tabpanel" hidden>
        <h1>Function Transformations</h1>

        <div class="tool-layout">
          <div class="graph">
            <canvas aria-label="Graph of the transformed functions"></canvas>
          </div>

          <div class="controls">
            <fieldset class="layer" data-index="0">
              <legend><span class="swatch"></span><span data-definition></span></legend>
              <div class="control">
                <label for="slider-n">n</label>
                <input type="range" id="slider-n" data-param="n" min="-3" max="6" step="1" value="2" />
                <output data-param="n"></output>
              </div>
            </fieldset>

            <ol class="layers"></ol>

            <button type="button" class="add-layer" data-action="add">+ Add transformation</button>
          </div>
        </div>

        <template data-layer-template>
          <li class="layer">
            <div class="layer-header">
              <span class="swatch"></span>
              <span data-definition></span>
              <button type="button" class="remove-layer" data-action="remove" aria-label="Remove transformation">×</button>
            </div>
            <select data-type aria-label="Transformation">
              <option value="shiftX">f(x + a) — shift left/right</option>
              <option value="scaleX">f(a·x) — stretch horizontally</option>
              <option value="scaleY">a·f(x) — stretch vertically</option>
              <option value="shiftY">f(x) + a — shift up/down</option>
            </select>
            <div class="control">
              <span class="label">a</span>
              <input type="range" data-param="a" min="-5" max="5" step="0.1" aria-label="a" />
              <output data-param="a"></output>
            </div>
          </li>
        </template>
      </section>
    </main>
  </body>
</html>
